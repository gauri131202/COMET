# Template: WIDE layout, one row per timestamp and one column per channel.
#
# To add a dataset: copy this file, rename it (for example my_mission.yaml), and replace
# the values below. Keys marked "optional" can be deleted. A mapping is checked when it is
# loaded; an unknown key or a wrong value is rejected with the field name in the message.
# For one reading per row (a channel column), use template_long.yaml instead.

# Short name for this source. Becomes the dataset name.
name: my_wide_source

layout: wide

# File glob, relative to the repo data/ folder (DATA_DIR in src/common/paths.py).
# A single file ("data.csv") or many ("Telemetry/*.csv"). Many files form one dataset.
files: "data.csv"

# The time column and its strptime format.
# Common formats: "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S", "%Y-%jT%H:%M:%S.%f" (day of year).
time:
  column: timestamp
  format: "%Y-%m-%d %H:%M:%S"

# optional: list the channel columns explicitly. If omitted, every column except the time
# column and exclude_columns is a channel.
# series_columns: [temperature, voltage, current]

# optional: columns to ignore. Ground-truth label columns can go here to keep them out of
# the features.
exclude_columns: []

# optional: columns kept as context (for example an identifier or a note) but not treated
# as channels.
# context_columns: [site]

# optional: keep only rows that pass every filter.
# Ops: eq, ne, in, not_in, empty, not_empty. "in" and "not_in" take a list.
# filters:
#   - {column: quality, op: eq, value: good}
#   - {column: site, op: in, value: [A, B]}

# optional: rows read per chunk (default 100000). Lower it if memory is tight.
# chunk_rows: 100000
