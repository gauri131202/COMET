# Lunar Flashlight channel files: long layout, one row per reading.
# files globs are relative to the repo data/ folder (DATA_DIR in src/common/paths.py).
name: lunar_flashlight
layout: long
files: "Telemetry/channels_rt_rec_*.csv"
time:
  column: ert
  format: "%Y-%jT%H:%M:%S.%f"
long:
  series: channelId
  value_eu: eu
  value_dn: dn
  status: status
  dn_alarm: dnAlarmState
  eu_alarm: euAlarmState
  session: sessionId
  kind: type
context_columns: [vcid]
exclude_columns: [recordType, sessionHost, dssId, module, realtime, scet, sclk, name]
chunk_rows: 200000
# Dictionary files, relative to the data/ folder.
dictionary:
  channels: "Dictionaries/channel.xml"
  alarms: "Dictionaries/alarms.xml"
# Source type names (CSV `type` and dictionary `type`) -> numeric or categorical.
# Matching ignores case, so FLOAT also covers the dictionary's `float`.
kind_map:
  FLOAT: numeric
  SIGNED_INT: numeric
  UNSIGNED_INT: numeric
  STATUS: categorical
  integer: numeric
  unsigned: numeric
  enum: categorical
